spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: dashboard-financeiro-notificacoes

  datasource:
    url: ${NOTIFICATIONS_DB_URL:jdbc:mysql://localhost:3306/dashboard_financeiro_notificacoes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: dashboard-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: com.dashboard_financeiro.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring:
        json:
          add:
            type:
              headers: false

server:
  port: ${SERVER_PORT:8083}

messaging:
  topics:
    user-events: user.events
    transaction-events: transactions.events
    goal-events: goals.events
    email-verification-events: user.verification

notifications:
  email:
    from: ${MAIL_FROM:no-reply@dashboard-financeiro.local}
    enabled: ${MAIL_ENABLED:true}
    fallback: ${MAIL_FALLBACK:suporte@dashboard-financeiro.local}
    dashboard-url: ${APP_DASHBOARD_URL:https://dashboard-financeiro-frontend-production-9e02.up.railway.app/login}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}

logging:
  level:
    com.dashboard_financeiro.notificacoes: DEBUG
    org.springframework.kafka: INFO
