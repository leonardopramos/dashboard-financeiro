spring:
  application:
    name: dashboard-financeiro

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=dashboard_financeiro;encrypt=false;trustServerCertificate=true
    username: sa
    password: Strong@Passw0rd
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
    show-sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: dashboard-financeiro-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring:
        json:
          add:
            type:
              headers: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
        provider:
          google:
            issuer-uri: https://accounts.google.com

security:
  jwt:
    issuer: dashboard-financeiro-auth
    secret: ${JWT_SECRET:bG9jYWwtand0LXNoYXJlZC1zZWNyZXQtMzItYnl0ZXMhIQ==}

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

messaging:
  topics:
    transaction-events: transactions.events
    goal-events: goals.events

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:sqlserver://sqlserver:1433;databaseName=dashboard_financeiro;encrypt=false;trustServerCertificate=true
    username: sa
    password: YourStrong@Passw0rd
