spring:
  application:
    name: dashboard-financeiro-cadastro-autenticacao

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=dashboard_financeiro_cadastro_autenticacao;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:Strong@Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring:
        json:
          add:
            type:
              headers: false

security:
  jwt:
    issuer: dashboard-financeiro-auth
    secret: bG9jYWwtand0LXNoYXJlZC1zZWNyZXQtMzItYnl0ZXMhIQ==
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-minutes: ${JWT_REFRESH_TOKEN_MINUTES:10080}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    org.springframework.security: INFO
    com.dashboard_financeiro.cadastroautenticacao: DEBUG

messaging:
  topics:
    user-events: user.events

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:sqlserver://sqlserver:1433;databaseName=dashboard_financeiro_cadastro_autenticacao;encrypt=false;trustServerCertificate=true
    username: sa
    password: Strong@Passw0rd

  kafka:
    bootstrap-servers: kafka:9094
