spring:
  application:
    name: dashboard-financeiro-cadastro-autenticacao

  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/dashboard_financeiro_cadastro_autenticacao?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring:
        json:
          add:
            type:
              headers: false

security:
  jwt:
    issuer: ${JWT_ISSUER:dashboard-financeiro-auth}
    secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-minutes: 10080

server:
  port: ${AUTH_SERVER_PORT:8081}

logging:
  level:
    org.springframework.security: INFO
    com.dashboard_financeiro.cadastroautenticacao: DEBUG

messaging:
  topics:
    user-events: user.events
    email-verification-events: user.verification

verification:
  email:
    code-length: 6
    expiration-minutes: 30
    resend-cooldown-minutes: 2
    max-attempts: 5

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://mysql:3306/dashboard_financeiro_cadastro_autenticacao?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
